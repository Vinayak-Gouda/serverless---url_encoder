service: url-shortener

frameworkVersion: '4'

useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1

  environment:
    DB_HOST: ${env:DB_HOST}
    DB_PORT: ${env:DB_PORT}
    DB_NAME: ${env:DB_NAME}
    DB_USER: ${env:DB_USER}
    DB_PASSWORD: ${env:DB_PASSWORD}

plugins:
  - serverless-offline

functions:
  createUrl:
    handler: src/handlers/create-url.handler
    events:
      - httpApi:
          path: /urls
          method: post

  redirectUrl:
    handler: src/handlers/redirect-url.handler
    events:
      - httpApi:
          path: /{shortCode}
          method: get